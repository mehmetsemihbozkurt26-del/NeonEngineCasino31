<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V22 ULTIMATE + NPC SYSTEM</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#fff;
}

.container{padding:10px;}

.card{
  background:#000;
  color:#fff;
  padding:10px;
  margin:10px 0;
}

button{width:100%;padding:10px;margin-top:5px;}

.chat,.log{
  background:#111;
  color:#0f0;
  height:80px;
  overflow:auto;
  font-size:12px;
  padding:5px;
}

/* ADMIN */
#adminDock{
  position:fixed;
  bottom:10px;
  right:10px;
  background:#000;
  color:#0f0;
  padding:10px;
  border:1px solid #0f0;
  cursor:pointer;
}

#adminPanel{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:450px;
  height:450px;
  background:#000;
  border:2px solid #0f0;
  display:none;
  z-index:999;
}

.header{
  background:#0f0;
  color:#000;
  padding:8px;
  display:flex;
  justify-content:space-between;
}

.scroll{
  height:120px;
  overflow:auto;
  background:#111;
  padding:5px;
  color:#fff;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
💰 Coin: <span id="coin">500</span>
</div>

<div class="card">
<button onclick="eventJackpot()">Jackpot</button>
<button onclick="eventChaos()">Chaos</button>
</div>

<div class="card">
<h3>NPC Messages</h3>
<div id="npc"></div>
</div>

</div>

<!-- ADMIN -->
<div id="adminDock" onclick="toggleAdmin()">👑 ADMIN</div>

<div id="adminPanel">

<div class="header">
ADMIN PANEL
<button onclick="toggleAdmin()">X</button>
</div>

<div class="scroll">

<h4>NPC CONTROL</h4>

<button onclick="toggleNPC('tn')">👼 TN (ON/OFF)</button>
<button onclick="toggleNPC('devil')">😈 Devil (ON/OFF)</button>
<button onclick="toggleNPC('stan')">🧢 Stan (ON/OFF)</button>

<h4>LOG (ADMIN ONLY)</h4>
<div id="log" class="chat"></div>

</div>

</div>

<script>

let coin=500;

/* NPC STATES */
let npcState={
 tn:true,
 devil:true,
 stan:true
};

/* ADMIN TOGGLE */
function toggleAdmin(){
 let p=document.getElementById("adminPanel");
 p.style.display = p.style.display==="block"?"none":"block";
}

/* EVENTS */
function eventJackpot(){
 coin+=100;
 log("Jackpot triggered");
 update();
}

function eventChaos(){
 coin=Math.random()*1000;
 log("Chaos triggered");
 update();
}

/* NPC SYSTEM */
function npcSpeak(){

 let msg="";

 if(npcState.tn){
  msg+="👼 TN: everything will be okay...<br>";
 }

 if(npcState.devil){
  msg+="😈 Devil: take risk, double or nothing 😏<br>";
 }

 if(npcState.stan){
  msg+="🧢 Stan: totally safe item bro trust me 😎<br>";
 }

 document.getElementById("npc").innerHTML=msg;
}

setInterval(npcSpeak,2000);

/* NPC TOGGLE */
function toggleNPC(npc){
 npcState[npc]=!npcState[npc];
 log(npc+" = "+npcState[npc]);
}

/* ADMIN LOG */
function log(t){
 document.getElementById("log").innerHTML+=t+"<br>";
}

/* UPDATE */
function update(){
 document.getElementById("coin").innerText=Math.floor(coin);
}

update();

</script>

</body>
</html>
